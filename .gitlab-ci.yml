image: maven:latest

stages:
    - build
    - install

build_job:
    stage: build
    tags:
        - docker
    script: 
        - echo "Maven compile started"
        - "mvn clean"
        - "mvn compile"

install_job:
    stage: install
    tags:
        - docker
    script:
        - echo "Maven installing started"
        - "mvn install"