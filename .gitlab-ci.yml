# First Stage: Setup for Arduino
image: ubuntu:latest

before_script:
    # run shell script for installing arduino-cli, Wio Terminal core, and project libraries
    - chmod +x setup-build-env.sh               # change permissions to execute bash shell script
    - ./setup-build-env.sh                      # execute bash shell script

stages:
    - build
    - deploy

compile_first_sketch:
    stage: build
    tags:
        - docker
    script:
        - arduino-cli compile --fqbn Seeeduino:samd:seeed_wio_terminal arduino/first_sketch.ino

compile_second_sketch:
    stage: build
    tags:
        - docker
    script:
        - arduino-cli compile --fqbn Seeeduino:samd:seeed_wio_terminal arduino/second_sketch.ino

compile:
    stage: build
    tags:
        - docker
    script:
        - export PATH=$PATH:/root/bin             # set the path to arduino-cli installation folder
        - pwd                                     # print the current working directory
        - cd arduino                              # change the directory to arduino folder
        - arduino-cli lib list                    # check that libraries are installed

        # Compile the first sketch file
        - arduino-cli compile --fqbn Seeeduino:samd:seeed_wio_terminal AcceleractionPublisher/AccelerationPublisher.ino

        # Compile the second sketch file
        - arduino-cli compile --fqbn Seeeduino:samd:seeed_wio_terminal SequenceGame.ino

        # Upload
        - arduino-cli board list                  # Check if device is connected
    except:
        - tags

release:
    stage: deploy
    tags:
        - upload
    script:
        - export PATH=$PATH:/root/bin             # set the path to arduino-cli installation folder
        - pwd                                     # print the current working directory
        - cd arduino                              # change the directory to arduino folder
        - arduino-cli lib list                    # check that libraries are installed

        # Compile the first sketch file
        - arduino-cli compile --fqbn Seeeduino:samd:seeed_wio_terminal AcceleractionPublisher/AccelerationPublisher.ino

        # Compile the second sketch file
        - arduino-cli compile --fqbn Seeeduino:samd:seeed_wio_terminal SequenceGame.ino

        # Upload
        - arduino-cli board list                  # Check if device is connected
        - arduino-cli upload -p $COM_PORT --fqbn Seeeduino:samd:seeed_wio_terminal           # if runnner is on local machine
    only:
        - tags

# Second Stage: Maven Build
build_and_install:
    image: maven:latest
    stage: build
    tags:
        - docker
    script:
        - echo "Maven compile started"
        - "mvn clean"
        - "mvn compile"

install_job:
    image: maven:latest
    stage: deploy
    tags:
        - docker
    script:
        - echo "Maven installing started"
        - "mvn install"
